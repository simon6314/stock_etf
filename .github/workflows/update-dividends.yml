name: 每日更新配息資料

on:
  schedule:
    - cron: '20 1 * * *'   # UTC 01:20 = 台北 09:20
  workflow_dispatch:       # 也可以在 Actions 頁面手動執行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 抓取最新配息
        run: node scripts/update-dividends.mjs
      - name: 有變更才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dividends.json
          if git diff --cached --quiet; then
            echo "沒有變更"
          else
            git commit -m "自動更新配息資料"
            git push
          fi
